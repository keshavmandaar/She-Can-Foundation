<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="45%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Shield/Crest Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E05A47" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orbLeft" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E05A47" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#E05A47" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbRight" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-width="0.6" stroke-opacity="0.05" />
    </pattern>

    <!-- Glow Filter for Emblem -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="920" height="260" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Glowing Orbs inside card -->
  <circle cx="150" cy="130" r="140" fill="url(#orbLeft)" />
  <circle cx="800" cy="180" r="160" fill="url(#orbRight)" />

  <!-- Grid Pattern Overlay -->
  <rect width="920" height="260" rx="18" fill="url(#grid)" />

  <!-- Corner Decorative Dashed Lines -->
  <path d="M 20 60 L 80 60 L 120 100" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <path d="M 900 200 L 840 200 L 800 160" fill="none" stroke="#FBBF24" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.3" />

  <!-- Left Glowing Shield Emblem -->
  <g transform="translate(70, 60)">
    <!-- Outer Glow Rings -->
    <circle cx="68" cy="68" r="62" fill="none" stroke="#E05A47" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="6 6" />
    <circle cx="68" cy="68" r="50" fill="#1E293B" fill-opacity="0.6" stroke="#E05A47" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Shield/Heart Crest with Glow -->
    <path filter="url(#glow)" d="M 68 28 C 44 28, 36 44, 36 60 C 36 88, 68 108, 68 108 C 68 108, 100 88, 100 60 C 100 44, 92 28, 68 28 Z" fill="url(#shieldGrad)" />
    
    <!-- Emblem Letter / Star -->
    <text x="68" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">S</text>
  </g>

  <!-- Right Content Area -->
  <g transform="translate(250, 68)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#E05A47" fill-opacity="0.15" stroke="#E05A47" stroke-width="1" stroke-opacity="0.4" />
    <!-- Green Status Dot -->
    <circle cx="16" cy="13" r="4.5" fill="#22C55E" />
    <!-- Badge Text -->
    <text x="30" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">NON-PROFIT EMPOWERMENT PLATFORM</text>

    <!-- Large Gradient Title -->
    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">She Can Foundation</text>

    <!-- Subtitle Line -->
    <text x="0" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8">Empowering Women · Educating Communities · Transforming India · Vanilla JS · CSS3</text>

    <!-- Terminal Status Bar -->
    <g transform="translate(0, 142)">
      <text font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700">
        <tspan fill="#38BDF8">&gt; STATUS:</tspan>
        <tspan fill="#22C55E"> 12,000+ Lives Touched | 7 Interactive Pages | 100% Responsive | Latency: 0ms</tspan>
      </text>
    </g>
  </g>
</svg>
